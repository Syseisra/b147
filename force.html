<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&display=swap">
<style>
:root{--bg:#101014;--panel:#17171c;--line:#26262e;--tx:#ececf0;--mut:#8b8b98;--sel:#39d353;--amb:#e3b341}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Archivo,-apple-system,system-ui,sans-serif;margin:0;padding:0 16px 60px}
header{position:sticky;top:0;background:var(--bg);z-index:10;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
h1{font-size:19px;font-weight:700;margin:0 0 2px;letter-spacing:.2px}
p.s{color:var(--mut);margin:0 0 10px;font-size:13.5px}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--amb);margin:26px 0 10px}
h2 small{color:var(--mut);font-weight:500;letter-spacing:0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
figure{margin:0;position:relative;border:3px solid transparent;border-radius:8px;overflow:hidden;background:var(--panel);cursor:pointer}
figure.k{border-color:var(--sel)}
figure img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
.n{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-weight:700;font-size:12px;padding:2px 7px;border-radius:5px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
figure.k .n{background:var(--sel);color:#06260f}
button{background:var(--sel);color:#06260f;border:0;border-radius:7px;padding:9px 16px;font:700 14px Archivo,sans-serif;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#count{margin-left:10px;color:var(--mut);font-size:13.5px}
#lb{position:fixed;inset:0;background:rgba(8,8,10,.93);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:92vh;border-radius:10px}
#lb .n{position:fixed;top:14px;left:16px;font-size:15px}
@media (prefers-reduced-motion:no-preference){figure{transition:border-color .1s}}

<script>
const S=new Set();
function pick(ev,f){ if(ev.target.tagName==='IMG')return; f.classList.toggle('k');
 const n=f.dataset.n; S.has(n)?S.delete(n):S.add(n);
 document.getElementById('count').textContent=S.size+' choisie'+(S.size>1?'s':'');}
function zoom(ev,img){ ev.stopPropagation();
 document.getElementById('lbi').src=img.src;
 document.getElementById('lbn').textContent='#'+img.parentElement.dataset.n.padStart(3,'0');
 document.getElementById('lb').classList.add('on');}
function cp(){ const t=[...S].sort((a,b)=>a-b).join(', ');
 try{navigator.clipboard.writeText(t)}catch(e){}
 document.getElementById('count').textContent=S.size+' copiées : '+t;}
</script>
