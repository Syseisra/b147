<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&display=swap">
<style>
:root{--bg:#101014;--panel:#17171c;--line:#26262e;--tx:#ececf0;--mut:#8b8b98;--amb:#e3b341}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Archivo,-apple-system,system-ui,sans-serif;margin:0;padding:0 16px 60px;max-width:1100px;margin-inline:auto}
header{padding:18px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
h1{font-size:20px;font-weight:700;margin:0 0 3px}
p.s{color:var(--mut);margin:0;font-size:13.5px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
figure{margin:0;border-radius:10px;overflow:hidden;background:var(--panel);cursor:zoom-in}
figure img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
figcaption{padding:7px 10px;font-size:12px;color:var(--amb);font-weight:700;letter-spacing:.4px}
#lb{position:fixed;inset:0;background:rgba(8,8,10,.94);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:95vw;max-height:93vh;border-radius:10px}
</style>
